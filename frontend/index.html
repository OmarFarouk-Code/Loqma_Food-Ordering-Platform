<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loqma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5 text-center">
    <h1>Loqma</h1>
    <p class="text-muted">Skip the cooking, we've got your back.</p>
    <p id="status" class="small">Checking backend...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    api.get('/api/health')
      .then(() => document.getElementById('status').textContent = 'Backend connected')
      .catch(() => document.getElementById('status').textContent = 'Backend not reachable');
  </script>
</body>
</html>
