spring.application.name=loqma
server.port=8080

# Each developer keeps their own DB password in application-local.properties
# (that file is git-ignored). Copy application-local.properties.example to start.
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Frontend origins allowed to call the API (VS Code Live Server defaults)
loqma.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-this-must-be-32-chars-or-more}
app.jwt.expiration-ms=86400000
server.error.include-message=always
app.admin.email=admin@loqma.com
app.admin.password=Choose#AStrongOne123


spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB