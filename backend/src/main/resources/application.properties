spring.application.name=loqma
server.port=8080

# Each developer keeps their own DB password in application-local.properties
# (that file is git-ignored). Copy application-local.properties.example to start.
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Frontend origins allowed to call the API (VS Code Live Server defaults)
loqma.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
